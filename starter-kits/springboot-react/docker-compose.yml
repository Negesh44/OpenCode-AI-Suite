version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: oaes-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: app_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - oaes-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: oaes-phpmyadmin
    restart: always
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "8081:80"
    networks:
      - oaes-network

  backend:
    build: ./backend
    container_name: oaes-backend
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/app_db
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: password
    ports:
      - "8080:8080"
    networks:
      - oaes-network

  frontend:
    build: ./frontend
    container_name: oaes-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080/api
    networks:
      - oaes-network

volumes:
  mysql_data:

networks:
  oaes-network:
    driver: bridge